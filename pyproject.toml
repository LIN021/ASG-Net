[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asg-net"
version = "0.1.0"
description = "ASG-Net for 3D low-grade glioma segmentation"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
training = ["nnunetv2==2.6.2"]

[tool.setuptools]
packages = ["asgnet"]
